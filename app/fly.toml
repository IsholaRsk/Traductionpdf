# fly.io — `fly launch` ou `fly deploy` depuis ce dossier.
# L'app n'a besoin que d'un port et d'un répertoire inscriptible pour son cache.
app = "passerelle"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  PASSERELLE_DIR = "/data"

[mounts]
  source = "passerelle_cache"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
